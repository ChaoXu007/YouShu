<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有数 v3 · 高级黑</title>
<style>
  :root{
    --accent:#0A84FF; --bg:#000; --card:#1C1C1E; --text:#F5F5F7; --sub:#98989F;
    --line:#2C2C2E; --chip-bg:#2C2C2E; --chip-line:#3A3A3C; --sel-text:#fff; --phone-bg:#000;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#161618;display:flex;flex-direction:column;align-items:center;padding:18px 0 28px;color:var(--text);}
  .caption{font-size:12px;color:#7C7C82;margin-bottom:12px;letter-spacing:.5px;}
  .phone{width:390px;height:844px;background:var(--phone-bg);border-radius:46px;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;position:relative;border:11px solid #0c0c0c;}
  .statusbar{height:46px;background:var(--phone-bg);display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:var(--text);flex:0 0 auto;}
  .statusbar .right{display:flex;gap:6px;align-items:center;font-size:12px;}
  .screen{flex:1;overflow:hidden;position:relative;background:var(--phone-bg);}
  .scr{display:none;height:100%;flex-direction:column;}
  .scr.active{display:flex;}
  .navbar{height:50px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;background:rgba(28,28,30,.80);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);font-size:17px;font-weight:600;border-bottom:1px solid var(--line);flex:0 0 auto;z-index:6;color:var(--text);}
  .navbar .back{position:absolute;left:14px;font-size:24px;color:var(--accent);cursor:pointer;line-height:1;font-weight:400;}
  .view-toggle{position:absolute;right:14px;font-size:20px;color:var(--accent);cursor:pointer;line-height:1;}
  .content{flex:1;overflow-y:auto;padding:14px;}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;}
  /* list */
  .search{background:var(--card);border-radius:12px;padding:9px 14px;color:var(--sub);font-size:14px;margin-bottom:12px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;}
  .chip{flex:0 0 auto;background:var(--chip-bg);border:1px solid var(--chip-line);border-radius:16px;padding:6px 14px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--sel-text);font-weight:600;}
  .item{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .ava{width:46px;height:46px;border-radius:13px;background:#2C2C2E;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
  .item-main{flex:1;min-width:0;}
  .item-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-sub{font-size:12px;color:var(--sub);margin:2px 0 7px;}
  .mini-prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .mini-prog>i{display:block;height:100%;border-radius:3px;}
  .item-loss{font-size:11px;margin-top:4px;font-weight:600;}
  .item-right{flex:0 0 auto;text-align:right;}
  .daily{font-size:17px;font-weight:700;color:var(--accent);}
  .daily-sub{font-size:11px;color:var(--sub);}
  .held{font-size:11px;color:#7C7C82;margin-top:4px;}
  .fab{position:absolute;right:18px;bottom:74px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;display:none;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(10,132,255,.55);cursor:pointer;z-index:20;line-height:1;}
  /* grid view */
  #listWrap.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;}
  #listWrap.grid .card.item{flex-direction:column;text-align:center;align-items:stretch;padding:16px 10px;min-height:160px;justify-content:center;}
  #listWrap.grid .ava{width:54px;height:54px;font-size:30px;margin:0 auto 10px;}
  #listWrap.grid .item-main{text-align:center;}
  #listWrap.grid .item-sub{margin:3px 0 9px;}
  #listWrap.grid .item-right{text-align:center;margin-top:10px;}
  #listWrap.grid .held{margin-top:6px;}
  #listWrap.grid .mini-prog{margin:0 auto;max-width:90%;}
  /* detail */
  .hero{text-align:center;padding:22px 14px;}
  .hero .big{font-size:42px;font-weight:800;color:var(--accent);letter-spacing:-1px;}
  .hero .sub{font-size:13px;color:var(--sub);margin-top:6px;}
  .loss-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:9px;}
  .loss-head b{font-size:16px;}
  .loss-bar{height:11px;background:var(--line);border-radius:6px;overflow:hidden;}
  .loss-bar>i{display:block;height:100%;}
  .loss-foot{font-size:12px;color:var(--sub);margin-top:9px;}
  .row{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row span{color:var(--sub);}
  .row b{font-weight:600;}
  .actions{display:flex;gap:10px;margin-top:4px;}
  .btn-primary{flex:1;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn-ghost{flex:1;background:transparent;color:var(--accent);border:1px solid var(--chip-line);border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn-danger{flex:1;background:#FF453A;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  /* entry */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:#AEAEB2;margin-bottom:7px;}
  .field input,.field select{width:100%;border:1px solid var(--chip-line);border-radius:11px;padding:12px 13px;font-size:15px;background:#1C1C1E;color:var(--text);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .price-in{display:flex;align-items:center;border:1px solid var(--chip-line);border-radius:11px;background:#1C1C1E;padding-left:13px;}
  .price-in span{font-size:16px;color:var(--sub);}
  .price-in input{border:none;flex:1;background:transparent;color:var(--text);}
  .preview{background:#1C1C1E;border:1px solid var(--chip-line);border-radius:11px;padding:11px 13px;font-size:13px;color:#6FB0FF;margin:2px 0 16px;}
  .life-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .life-chips span{flex:0 0 auto;background:#1C1C1E;border:1px solid var(--chip-line);border-radius:14px;padding:8px 15px;font-size:13px;color:#AEAEB2;cursor:pointer;}
  .life-chips span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .cat-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .cat-chips span{flex:0 0 auto;background:#1C1C1E;border:1px solid var(--chip-line);border-radius:14px;padding:8px 13px;font-size:13px;color:#AEAEB2;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .cat-chips span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  /* stats */
  .sum-grid{display:flex;gap:12px;margin-bottom:12px;}
  .sum{flex:1;background:var(--card);border-radius:15px;padding:14px;}
  .sum .t{font-size:12px;color:var(--sub);}
  .sum .v{font-size:22px;font-weight:800;color:var(--accent);margin-top:6px;}
  .sec-title{font-size:14px;font-weight:700;margin:6px 2px 12px;}
  .donut-wrap{display:flex;align-items:center;gap:16px;}
  .donut{width:120px;height:120px;border-radius:50%;flex:0 0 auto;position:relative;}
  .donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card);}
  .legend{flex:1;}
  .leg{display:flex;align-items:center;font-size:13px;margin-bottom:9px;}
  .leg .dot{width:10px;height:10px;border-radius:3px;margin-right:8px;flex:0 0 auto;}
  .leg .nm{color:#C7C7CC;flex:1;}
  .leg .vl{font-weight:600;}
  .rank{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .rank .nm{width:84px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;color:#C7C7CC;}
  .rank .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .rank .bar>i{display:block;height:100%;}
  .rank .pc{width:42px;text-align:right;font-size:13px;font-weight:700;flex:0 0 auto;}
  .arch-card{cursor:pointer;}
  .arch-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;}
  .arch-tags .chip{cursor:default;}
  /* mine */
  .hero-mine{text-align:center;padding:26px 14px;background:linear-gradient(135deg,#0A84FF,#5AC8FA);color:#fff;}
  .hero-mine .app-name{font-size:30px;font-weight:800;letter-spacing:3px;}
  .hero-mine .slogan{font-size:15px;font-weight:600;margin-top:9px;opacity:.96;}
  .menu{background:var(--card);border-radius:15px;overflow:hidden;}
  .menu-item{padding:15px 16px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--text);}
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:#2C2C2E;}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:12px;line-height:1.6;padding:0 10px;}
  .tabbar{height:60px;background:rgba(28,28,30,.92);border-top:1px solid var(--line);display:flex;flex:0 0 auto;backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:11px;cursor:pointer;}
  .tab.active{color:var(--accent);}
  .tab .ic{font-size:21px;}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;}
  /* 分类分布：横向条状图（按总价倒序，风格同损耗排行） */
  .catbar{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .catbar:last-child{margin-bottom:0;}
  .catbar .nm{width:80px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;color:var(--sub);display:flex;align-items:center;gap:4px;}
  .catbar .bar{flex:1;height:9px;background:var(--line);border-radius:5px;overflow:hidden;}
  .catbar .bar>i{display:block;height:100%;background:var(--accent);border-radius:5px;}
  .catbar .vl{text-align:right;font-size:13px;font-weight:700;color:var(--accent);flex:0 0 auto;white-space:nowrap;}
  .catbar .vl small{font-weight:400;color:var(--sub);font-size:11px;margin-left:4px;}
</style>
</head>
<body>
  <div class="caption">有数 v3 · 高级黑（暗色 premium）｜ 点右上角 ▦ 切换方格视图</div>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span class="right">●●● &nbsp; Wi-Fi &nbsp; 🔋</span></div>
    <div class="screen">
      <div class="scr active" id="scr-list">
        <div class="navbar">物品<span class="view-toggle" id="viewToggle" onclick="toggleView()">▦</span></div>
        <div class="content">
          <div class="search" onclick="document.getElementById('q').focus()">🔍 搜索物品 / 品牌</div>
          <input id="q" style="display:none" oninput="renderList()">
          <div class="chips" id="catChips"></div>
          <div id="listWrap"></div>
        </div>
      </div>
      <div class="scr" id="scr-detail">
        <div class="navbar"><span class="back" onclick="backFromDetail()">‹</span><span id="detTitle">详情</span></div>
        <div class="content" id="detWrap"></div>
      </div>
      <div class="scr" id="scr-entry">
        <div class="navbar"><span class="back" onclick="showScreen('scr-list')">‹</span>添加物品</div>
        <div class="content">
          <div class="field"><label>名称 *</label><input id="e-name" placeholder="如 iPhone 15 Pro"></div>
          <div class="field"><label>购买价格 *</label><div class="price-in"><span>¥</span><input id="e-price" type="number" placeholder="0.00" oninput="updatePreview()"></div></div>
          <div class="field"><label>购买日期 *</label><input id="e-date" type="date" value="2026-07-09" oninput="updatePreview()"></div>
          <div class="preview" id="e-preview">填写价格与日期后，自动预估「日均使用价格」</div>
          <div class="field"><label>品牌</label><input id="e-brand" placeholder="选填，如 Apple"></div>
          <div class="field"><label>分类</label><div class="cat-chips" id="e-cat"></div></div>
          <div class="field"><label>预计使用年限 *（用于计算损耗率，可修改）</label>
            <div class="life-chips" id="e-life">
              <span data-y="0.5">半年</span><span data-y="1" class="on">1 年</span><span data-y="2">2 年</span><span data-y="3">3 年</span><span data-y="5">5 年</span>
            </div>
            <input id="e-life-custom" type="number" placeholder="或自定义年限（年）" style="margin-top:9px;" oninput="customLife()">
          </div>
          <button class="btn-primary" onclick="saveEntry()">保存</button>
        </div>
      </div>
      <div class="scr" id="scr-stats"><div class="navbar">统计</div><div class="content" id="statsWrap"></div></div>
      <div class="scr" id="scr-archive"><div class="navbar"><span class="back" onclick="showScreen('scr-stats')">‹</span>归档物品</div><div class="content" id="archiveWrap"></div></div>
      <div class="scr" id="scr-mine"><div class="navbar">我的</div><div class="content" id="mineWrap"></div></div>
    </div>
    <div class="fab" id="fab" onclick="openEntry()">＋</div>
    <div class="tabbar">
      <div class="tab active" id="tab-list" onclick="showScreen('scr-list')"><div class="ic">📦</div>物品</div>
      <div class="tab" id="tab-stats" onclick="showScreen('scr-stats')"><div class="ic">📊</div>统计</div>
      <div class="tab" id="tab-mine" onclick="showScreen('scr-mine')"><div class="ic">👤</div>我的</div>
    </div>
  </div>
  <script src="shared.js"></script>
</body>
</html>
